
- name: Install nginx on dev-test-az1
  hosts: dev-test-az1
  become: yes
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Update package cache (RedHat)
      yum:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install nginx (Debian/Ubuntu)
      apt:
        name: nginx
        state: present
      when: ansible_os_family == "Debian"

    - name: Start nginx service
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Verify nginx is running
      debug:
        msg: "nginx installation complete and service is running"
